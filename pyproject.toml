[project]
name = "wextraui"
description = "WextraUI — extra nodes for ComfyUI, from the Winteraction workbench: WSave Image (file name built from parts), WLoRA (LoRA + trigger words into the prompt, folder menu, seed-style walk), WCheckpoint (same folder menu and walk for checkpoints), WSwitch (slots of cables, one on, the rest asleep), WFloat (a float that walks run after run), WFrame (crop · resize · place for outpaint), WPrompt Rows, WRoute, WDifference, and the WScene / WLoop family: MiniMax H3 multi-scene loop with video + audio hand-off."
version = "0.6.0"
license = { file = "LICENSE" }
dependencies = []

