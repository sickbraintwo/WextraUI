[project]
name = "wextraui"
description = "Extra nodes for ComfyUI, from the Winteraction workbench. Time works for you: WextraUI nodes have a control after generate and the carry that links them, so a queue of runs changes checkpoint, LoRA, sampler, scheduler, seed, frame and prompt on its own, and WSave Image puts every image in the right place with a file name built from parts. One press of Run and the machine never stops. Thirty-one nodes: WCheckpoint, WLoRA, WSampler, WScheduler, WInt, WFloat, WSwitch, WRoute, WDifference, WFrame, WReso, WRatio, WPrompt Rows for any workflow; under WextraUI/H3 the seven nodes of the H3 scene loop (WScene, WLoop) for MiniMax H3 Sync Sound, a film as a list of scenes with continuous audio; under WextraUI/Video, Audio and Foley the nine for the sound of a video: WExtractor, WMount, WCutScene, WAudio Prompts, the Foley loop (LTX-2.3 video-to-audio, a prompt per scene, in one Run), WMixer, a timeline mixer inside the node, and WAonV, the sound on the picture. No ffmpeg to install."
version = "0.10.0"
license = { file = "LICENSE" }
dependencies = []

