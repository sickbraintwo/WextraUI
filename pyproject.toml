[project]
name = "wextraui"
description = "Extra nodes for ComfyUI, from the Winteraction workbench. Time works for you: WCheckpoint, WLoRA, WLoRA Stack, WSampler, WScheduler, WInt (seed), WFloat (cfg or denoise) and WSwitch have a control after generate and the carry that links them, so a queue of runs changes everything on its own, and WSave Image writes into every file name the values that made that image. One press of Run and the machine never stops. 34 nodes in all, for the classic canvas and for Nodes 2.0. With them WReso, WRatio, WFrame, WPrompt Rows, WRoute, WRoute Index, Wif, WIndex and WDifference; under WextraUI/H3 the 7 of the scene loop for MiniMax H3 Sync Sound, a film as a list of scenes with continuous audio; under Video, Audio and Foley WExtractor, WMount, WCutScene, WAudio Prompts, the Foley loop (LTX-2.3 video-to-audio, a prompt per scene, in one Run), WMixer to build the soundtrack in the timeline inside the node and WAonV, the sound on the picture. No ffmpeg to install."
version = "1.0.0"
license = { file = "LICENSE" }
dependencies = []

